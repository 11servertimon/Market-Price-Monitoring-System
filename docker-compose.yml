version: "3.9"

services:
  db:
    image: postgres:16
    container_name: mpms_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # ako već koristiš lokalni Postgres na 5432, mapiramo na 5433
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mpms_web
    env_file:
      - .env
    environment:
      # u Dockeru se Django kači na servis 'db', ne na localhost
      DB_HOST: db
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend

volumes:
  postgres_data:
